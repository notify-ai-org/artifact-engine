# Standalone Artifact MCP configuration.
# Precedence: command-line arguments, OS environment variables, then this file.

# Process-bound MCP identity (required)
ARTIFACT_MCP_PRINCIPAL_ID=
ARTIFACT_MCP_TENANT_ID=
ARTIFACT_MCP_SCOPES=

# MCP response and request limits
ARTIFACT_MCP_MAX_TEXT_CHARACTERS=32768
ARTIFACT_MCP_MAX_CONTENT_BYTES=262144
ARTIFACT_MCP_REQUEST_TIMEOUT_SECONDS=30

# PostgreSQL. Leave both URLs empty to use process-local metadata and vector stores.
ARTIFACT_JDBC_URL=
JDBC_DATABASE_URL=
ARTIFACT_JDBC_USER=
DB_USER=
ARTIFACT_JDBC_PASSWORD=
DB_PASSWORD=
ARTIFACT_JDBC_MAX_POOL_SIZE=8
ARTIFACT_JDBC_MIN_IDLE=1
ARTIFACT_VECTOR_DIMENSIONS=1536

# S3 object storage (bucket and KMS key are required)
ARTIFACT_S3_BUCKET=
ARTIFACT_S3_KMS_KEY_ID=
ARTIFACT_S3_REGION=ap-south-1
ARTIFACT_S3_ENVIRONMENT=default
ARTIFACT_S3_EXPECTED_BUCKET_OWNER=
ARTIFACT_S3_BUCKET_KEY_ENABLED=true

# Durable local intake spool
ARTIFACT_SPOOL_ROOT=./data/artifact-spool
ARTIFACT_SPOOL_MAX_ARTIFACT_BYTES=134217728

# OpenAI-compatible embedding endpoint
EMBEDDING_BASE_URL=https://api.openai.com/v1
EMBEDDING_API_PATH=/embeddings
EMBEDDING_API_KEY=
OPENAI_API_KEY=
EMBEDDING_QUERY_MODEL=text-embedding-3-small
EMBEDDING_MODELS=
EMBEDDING_MODEL_VERSION=text-embedding-3-small
EMBEDDING_MAX_BATCH_SIZE=32
EMBEDDING_CONNECT_TIMEOUT_SECONDS=10
EMBEDDING_TIMEOUT_SECONDS=30
